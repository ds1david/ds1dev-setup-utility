name: Runbook contract
on:
  push:
  pull_request:
jobs:
  contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate discovery and execution
        shell: pwsh
        run: ./tests/runbooks.tests.ps1
      - name: Validate bootstrap without installing
        shell: pwsh
        run: |
          ./tests/bootstrap.tests.ps1
          ./tests/bootstrap-handoff.tests.ps1
      - name: Validate native Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/bootstrap.tests.ps1
          ./tests/bootstrap-handoff.tests.ps1
